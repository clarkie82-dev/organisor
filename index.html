<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Organisor</title>
  <link rel="stylesheet" href="vendor/flatpickr/flatpickr.min.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="app-header">
    <h1 class="app-title">Organisor</h1>
    <div class="header-actions">
      <button type="button" id="btn-add-task" class="btn btn-primary">Add task</button>
      <button type="button" id="btn-archive" class="btn btn-ghost">Archive</button>
    </div>
  </header>

  <main class="app-main">
    <aside class="planner" aria-label="Today's planner">
      <div class="planner-header">
        <h2>Today</h2>
        <p id="planner-date" class="planner-date"></p>
      </div>

      <section class="now-panel" aria-live="polite">
        <p class="now-label">Right now</p>
        <div id="now-focus" class="now-focus"></div>
      </section>

      <section class="schedule-section">
        <h3>Schedule</h3>
        <ul id="schedule-list" class="schedule-list"></ul>
        <form id="schedule-form" class="schedule-form">
          <label class="sr-only" for="block-start">Start</label>
          <input type="time" id="block-start" required />
          <label class="sr-only" for="block-end">End</label>
          <input type="time" id="block-end" required />
          <input type="text" id="block-label" placeholder="Label (optional)" maxlength="80" />
          <button type="submit" class="btn btn-secondary btn-sm">Add block</button>
        </form>
      </section>
    </aside>

    <section class="matrix" aria-label="Eisenhower matrix">
      <h2 class="sr-only">Tasks</h2>
      <div class="matrix-grid">
        <div class="quadrant" data-quadrant="q1">
          <header class="quadrant-header q1">Do first <span class="quadrant-sub">Urgent · Important</span></header>
          <div class="quadrant-drop" data-quadrant="q1"></div>
        </div>
        <div class="quadrant" data-quadrant="q2">
          <header class="quadrant-header q2">Schedule <span class="quadrant-sub">Not urgent · Important</span></header>
          <div class="quadrant-drop" data-quadrant="q2"></div>
        </div>
        <div class="quadrant" data-quadrant="q3">
          <header class="quadrant-header q3">Delegate <span class="quadrant-sub">Urgent · Not important</span></header>
          <div class="quadrant-drop" data-quadrant="q3"></div>
        </div>
        <div class="quadrant" data-quadrant="q4">
          <header class="quadrant-header q4">Eliminate <span class="quadrant-sub">Not urgent · Not important</span></header>
          <div class="quadrant-drop" data-quadrant="q4"></div>
        </div>
      </div>
    </section>
  </main>

  <dialog id="task-dialog" class="task-dialog">
    <form id="task-form" method="dialog">
      <h3 id="task-dialog-title">New task</h3>
      <label>
        Short description
        <input type="text" id="task-description" required maxlength="120" placeholder="What needs doing?" />
      </label>
      <label>
        Who it's for
        <input type="text" id="task-who" maxlength="80" placeholder="Person or team" />
      </label>
      <label>
        Date of completion (required by)
        <input type="text" id="task-required-by" inputmode="numeric" placeholder="DD/MM/YYYY" autocomplete="off" />
      </label>
      <label>
        Notes
        <textarea id="task-notes" rows="4" placeholder="Additional details"></textarea>
      </label>
      <label>
        Quadrant
        <select id="task-quadrant">
          <option value="q1">Do first</option>
          <option value="q2" selected>Schedule</option>
          <option value="q3">Delegate</option>
          <option value="q4">Eliminate</option>
        </select>
      </label>
      <div class="dialog-actions">
        <button type="button" id="task-cancel" class="btn btn-ghost">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </dialog>

  <aside id="archive-drawer" class="archive-drawer" aria-hidden="true">
    <div class="archive-panel">
      <header class="archive-header">
        <h2>Archive</h2>
        <button type="button" id="btn-close-archive" class="btn btn-ghost btn-icon" aria-label="Close archive">×</button>
      </header>
      <ul id="archive-list" class="archive-list"></ul>
    </div>
    <button type="button" id="archive-backdrop" class="archive-backdrop" aria-label="Close archive"></button>
  </aside>

  <script src="vendor/flatpickr/flatpickr.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
